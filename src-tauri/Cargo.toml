[package]
name = "attune"
version = "0.1.0"
description = "Local-first English dictation workbench"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
ureq = "2"
whisper-rs = "0.16"
